<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dino Lab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Dino Lab</h1>
  <p class="sub">A small runner whose speed rule you control. Space / ↑ to jump.</p>
  <canvas id="game" width="720" height="200" aria-label="Runner game"></canvas>
  <div class="row">
    <button id="play">Play</button>
    <button id="jump">Jump ↑</button>
    <span id="readout"></span>
  </div>
  <section class="controls">
    <label>Start speed <output id="o-start"></output>
      <input id="start" type="range" min="2" max="14" step="0.1" value="6"></label>
    <label>Acceleration / frame <output id="o-accel"></output>
      <input id="accel" type="range" min="0" max="0.005" step="0.0001" value="0.001"></label>
    <label>Max speed <output id="o-max"></output>
      <input id="max" type="range" min="2" max="25" step="0.5" value="13"></label>
    <button id="reset-defaults">Chrome defaults (6 / 0.001 / 13)</button>
  </section>
  <p class="note">Rule: every frame at 60&nbsp;Hz, <code>if (speed &lt; max) speed += acceleration</code>.
  At the defaults that reaches max after ~7000 frames (≈ 117&nbsp;s).</p>
</main>
<script src="game.js"></script>
</body>
</html>
